[package]
name = "fishy-client"
version = "2.0.2"
description = "Fishy Client, a lightweight Epic Games launcher"
authors = ["Fishy Client contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fishy_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
fishy-core = { path = "../../crates/fishy-core" }
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-util = "0.7"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tracing = "0.1"

# Game shortcuts (spec §6t): Windows' own shortcut maker. Same version Tauri already builds.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
fishy-core = { path = "../../crates/fishy-core", features = ["test-support"] }
tempfile = "3"
# Update-signature tests: a throwaway key pair and the updater plugin in a mock app.
tauri = { version = "2.12", features = ["test"] }
minisign = "0.7"
base64 = "0.23"
