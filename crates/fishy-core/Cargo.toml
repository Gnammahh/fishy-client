[package]
name = "fishy-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
description = "Epic Games logic for Fishy Client (auth, library, downloads)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
url = "2"
futures = "0.3"
tokio = { version = "1", features = ["sync", "rt", "time", "fs", "macros"] }
tokio-util = "0.7"
flate2 = "1"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
fs4 = { version = "0.13", features = ["sync"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
# Test helpers (manifest builder) for other crates' tests. Never on in the shipped app.
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "test-util"] }
wiremock = "0.6"
tempfile = "3"
